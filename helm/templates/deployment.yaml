# Kubernetes Deployment template for gitops-app
# This Helm template creates a Deployment resource

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  # Number of pod replicas (from values.yaml)
  replicas: {{ .Values.replicaCount }}

  # How to find pods that belong to this deployment
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}

  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  # Pod template
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}

      containers:
        - name: {{ .Chart.Name }}
          # Docker image from values.yaml
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # Container port
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Environment variables
          env:
            {{- toYaml .Values.env | nindent 12 }}

          # Health checks
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}

          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}

          # Resource limits from values.yaml
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
