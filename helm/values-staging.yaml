# Staging environment overrides
# These values override the defaults in values.yaml for staging

# Fewer replicas in staging to save costs
replicaCount: 1

# Staging image tag (latest dev build)
image:
  tag: "latest"
  pullPolicy: Always

# Staging ingress host
ingress:
  enabled: true
  hosts:
    - host: staging.app.example.com
      paths:
        - path: /
          pathType: Prefix

# Lower resource limits in staging
resources:
  limits:
    cpu: "200m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"

# Staging environment variables
env:
  - name: APP_ENV
    value: "staging"
  - name: LOG_LEVEL
    value: "debug"
  - name: PORT
    value: "8080"
  - name: FEATURE_FLAGS
    value: "all"
